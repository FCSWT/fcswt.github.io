<style>
:root{
  --bg:#f3f6f1; --surface:#ffffff; --sunk:#e9eee6; --fg:#16211a; --muted:#5b6a5f; --line:#d8e0d5;
  --pitch:#1d7444; --pitch-ink:#ffffff; --pitch-soft:#dcefe2;
  --bibY:#e3b90f; --bibY-ink:#2a2200; --bibB:#2d66cc; --bibB-ink:#ffffff; --bibW:#f7f7f4; --bibW-ink:#222;
  --warn-soft:#fbe9dc; --ok:#1d7444; --no:#a3362b; --no-soft:#f8e1de;
  --brand:#ff1493; --brand-ink:#ffffff; --late:#c26a00;
  --display:"Black Han Sans","Noto Sans KR",system-ui,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0e1410; --surface:#171f19; --sunk:#111813; --fg:#e5ece4; --muted:#93a297; --line:#29342c;
  --pitch:#46b873; --pitch-ink:#08130c; --pitch-soft:#1b3324; --late:#f0a33a;
  --bibY:#e3c03a; --bibY-ink:#201a00; --bibB:#5b8ee6; --bibB-ink:#06101f; --bibW:#d9dcd6; --bibW-ink:#151815;
  --warn-soft:#3a2617; --ok:#46b873; --no:#e57b6f; --no-soft:#3a1d1a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pitch);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{padding-block:14px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.crest{display:inline-block;flex:none;background:center/contain no-repeat;aspect-ratio:277/411}
.crest-h{height:44px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.crest-g{height:128px;align-self:center;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25))}
.crest-s{height:1.35em;margin:-2px 0}
.brand h1{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.1;margin:0;letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;-webkit-text-stroke:.6px currentColor;text-shadow:0 2px 0 rgba(0,0,0,.22),0 3px 10px rgba(0,0,0,.18)}
@media (max-width:480px){.brand h1{font-size:24px;letter-spacing:.5px}.crest-h{height:40px}.brand .whonm{display:none}.brand{gap:8px}}
@media (max-width:360px){.brand .who{display:none}.brand h1{font-size:22px;letter-spacing:0}}
.brand .side{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.brand .side button{background:none;border:1px solid currentColor;color:inherit;border-radius:7px;padding:3px 8px;font-size:12px;opacity:.9}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs:empty{display:none}
nav.tabs button{background:none;border:0;color:inherit;opacity:.75;padding:8px 12px 10px;font-weight:700;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--brand-ink)}
.top .wrap:has(nav.tabs:empty){padding-bottom:14px}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bibY);color:var(--bibY-ink);font-size:11px;line-height:18px;margin-left:4px;text-align:center}
main .wrap{padding-block:18px 60px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--display);font-weight:400;font-size:19px;margin:6px 0 0;letter-spacing:.3px}
h3{font-size:15px;margin:0}
p{margin:0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .sm{font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 12px;font-weight:500;font-size:14px}
.btn.primary{background:var(--pitch);color:var(--pitch-ink);border-color:var(--pitch);font-weight:700}
.btn.ghost{background:none}
.btn.danger{color:var(--no);border-color:var(--no)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;color:var(--pitch);font-weight:700;padding:0;font-size:14px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);padding:8px 10px;font-weight:700;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"].y{background:var(--pitch);color:var(--pitch-ink)}
.seg button[aria-pressed="true"].n{background:var(--no);color:#fff}
.seg button[aria-pressed="true"].m{background:var(--sunk)}
.vline{display:flex;gap:8px;align-items:baseline;font-size:14px;line-height:1.5}.vline .vt{flex:none;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;background:var(--sunk);color:var(--muted)}.vline .vt.n{color:var(--no)}
.cm{border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:8px}
.cmh{display:flex;justify-content:space-between;align-items:center;font:inherit;font-weight:700;font-size:15px;background:none;border:0;padding:2px 0;color:var(--fg);cursor:pointer;width:100%;text-align:left}.cmh .muted{font-weight:400}
.c{display:flex;gap:8px;align-items:flex-start}
.c .av{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--pitch)}
.c .bd{background:var(--sunk);border-radius:12px;padding:7px 10px}
.c .nm{font-size:13px;font-weight:700}.c .nm em{font-style:normal;font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.c .tx{font-size:15px;line-height:1.45;margin-top:1px;white-space:pre-wrap;word-break:break-word}
.c .ac{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:2px;padding-left:2px}
.lk{background:none;border:0;padding:2px 0;font:inherit;color:inherit;cursor:pointer}.lk b{color:var(--fg)}
.c.reply{margin-left:38px}.c.reply .av{width:26px;height:26px;font-size:11px}
.c.mk .bd{outline:2px solid var(--brand);outline-offset:2px}
.cin{display:flex;gap:6px;align-items:center}.cin input{flex:1;min-width:0;border:1px solid var(--line);border-radius:20px;padding:9px 14px;font-size:16px;background:var(--surface);color:var(--fg)}
.rto{font-size:12px;background:var(--sunk);color:var(--brand);border-radius:8px;padding:4px 8px;display:flex;justify-content:space-between;align-items:center}
.cmclosed{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:9px;padding:8px 10px}
.tops{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card.tk{padding:12px 12px 10px;gap:6px}
.toph{display:flex;align-items:center;gap:6px;font-size:15px}.toph b{font-weight:800}
.tk ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tk li{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:8px;font-size:15px}
.tk .rk{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--sunk);color:var(--muted)}
.tk li.r1 .rk{background:var(--brand);color:var(--brand-ink)}
.tk .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .tv{font-variant-numeric:tabular-nums;font-size:16px}.tk .tv small{font-size:11px;font-weight:400;color:var(--muted);margin-left:1px}
.tk li.me{background:var(--sunk)}.tk li.me .tn{font-weight:700}
.tmore{font-size:12px;color:var(--muted);text-align:right;padding:2px 4px 0}
.cardacts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-top:1px dashed var(--line);padding-top:8px}
.closed{background:var(--sunk);border-radius:9px;padding:10px 12px;font-size:14px}
.closebar{border-top:1px dashed var(--line);padding-top:8px}.closebar .cl{color:var(--no)}.closebar .op{color:var(--pitch)}
.btn[disabled]{opacity:.35;pointer-events:none}
.seg button.e{color:var(--late)}.seg button[aria-pressed="true"].e{background:var(--late);color:#fff}
.count.e{color:var(--late)}
.chip .lv{font-size:11px;font-weight:700;color:var(--late);background:var(--surface);border-radius:6px;padding:1px 5px;margin-left:2px}
.lvgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lvgrid .chip{justify-content:center;font-size:16px;padding:10px 0;font-variant-numeric:tabular-nums}
.lvgrid .chip[aria-pressed="true"]{background:var(--late);color:#fff;border-color:var(--late)}
.date{font-family:var(--display);font-size:22px;line-height:1}
.date small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--surface);display:inline-flex;align-items:center;gap:5px}
.chip .pos{font-size:11px;color:var(--muted);font-weight:700}
.chip.K{background:#1b1d1c;color:#fff;border-color:#55605a}
.chip.U{background:#2563d6;color:#fff;border-color:#2563d6}
.chip.Y{background:#f2c418;color:#231c00;border-color:#d9ad00}
.chip.R{background:#d6332a;color:#fff;border-color:#d6332a}
.chip.W{background:#fbfbf8;color:#1b1d1c;border-color:#9aa29b}
.chip.P{background:#ff4fa3;color:#fff;border-color:#ff4fa3}
.chip.K .pos,.chip.U .pos,.chip.Y .pos,.chip.R .pos,.chip.W .pos,.chip.P .pos{color:inherit;opacity:.75}
.chip.off{opacity:.45}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;border:1px solid rgba(0,0,0,.15)}
.dot.K{background:#1b1d1c;border-color:#7d8780} .dot.U{background:#2563d6} .dot.Y{background:#f2c418} .dot.R{background:#d6332a} .dot.W{background:#fbfbf8;border-color:#9aa29b} .dot.P{background:#ff4fa3}
.teamsel{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
.teamsel .chip{padding:3px 8px;font-size:12px}
.member.teamrow{flex-wrap:wrap;row-gap:8px}
.member.teamrow .teamsel{flex-basis:100%;justify-content:flex-start;padding-left:44px}
.member .who b{word-break:keep-all}
.cs{display:flex;flex-wrap:wrap;gap:6px}
.gtabs .chip{font-weight:700}
.pitch{position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:4/5;border-radius:10px;overflow:hidden;border:2px solid rgba(255,255,255,.8);background:repeating-linear-gradient(180deg,#1f7a42 0 10%,#1a6b3a 10% 20%)}
.pitch i{position:absolute;border:2px solid rgba(255,255,255,.75);pointer-events:none}
.pitch .arc{left:50%;top:0;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.pitch .box{left:22%;right:22%;bottom:-2px;height:17%}
.pitch .six{left:38%;right:38%;bottom:-2px;height:6.5%}
.slot{position:absolute;transform:translate(-50%,-50%);width:60px;min-height:46px;border-radius:12px;border:2px dashed rgba(255,255,255,.75);background:rgba(0,0,0,.2);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px 2px;font-size:11px;line-height:1.15}
.slot em{font-style:normal;font-weight:700;font-size:12px;letter-spacing:.5px}
.slot b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1}
.slot span{max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.slot.fill{border-style:solid;box-shadow:0 2px 6px rgba(0,0,0,.35);z-index:2;min-height:56px;padding:4px 2px}
.slot.K{background:#1b1d1c;border-color:#8a948d}.slot.U{background:#2563d6;border-color:#fff}.slot.Y{background:#f2c418;color:#231c00;border-color:#fff}.slot.R{background:#d6332a;border-color:#fff}.slot.W{background:#fbfbf8;color:#1b1d1c;border-color:#9aa29b}.slot.P{background:#ff4fa3;border-color:#fff}
.slot{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.slot.drag{cursor:grabbing;z-index:5;transform:translate(-50%,-50%) scale(1.08);box-shadow:0 6px 16px rgba(0,0,0,.45)}
.slot small{font-size:9px;font-weight:700;opacity:.8;letter-spacing:.5px}
.slot.pick{outline:3px solid #fff;outline-offset:2px;background:rgba(255,255,255,.25)}
.chip.cur{outline:2px solid var(--fg);outline-offset:1px}
details.mon{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
details.mon>summary,details.day>summary{display:flex;justify-content:space-between;align-items:center;gap:10px}
details.mon>summary{font-family:var(--display);font-weight:400;font-size:17px}
details.day{border-top:1px solid var(--line);padding-top:10px}
details.day>summary{font-weight:700}
.daysum{font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;flex:1}
details.mon>summary::after,details.day>summary::after{flex:none}
details.day .card{background:var(--bg)}
.tbadge{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:4px 10px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:1px solid transparent}
.a2b{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--brand);border-radius:14px;padding:12px 10px 12px 14px}
.a2bi{font-size:26px;flex:none}.a2bt{flex:1;min-width:0;display:flex;flex-direction:column;font-size:13px;color:var(--muted)}.a2bt b{font-size:15px;color:var(--fg)}
.a2x{flex:none;border:0;background:none;color:var(--muted);font-size:18px;padding:6px;cursor:pointer}
.a2link{display:block;margin:24px auto 0;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:99px;padding:8px 16px;font-size:14px;font-weight:500;cursor:pointer}
.a2link+.ver{margin-top:8px}
.a2warn{background:#fff6d6;color:#3a2e00;border:1.5px solid #e7c34a;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}.a2warn p{margin:4px 0 0}
.a2{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.a2 li{display:flex;gap:12px;align-items:flex-start}
.a2n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px}
.a2t{flex:1;min-width:0}.a2t p{margin:4px 0 8px;font-size:17px;line-height:1.55}.a2t .muted{font-size:14px}
.a2v{display:flex}
.a2key{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 4px;border:1.5px solid currentColor;border-radius:8px;vertical-align:middle;font-weight:800;line-height:1}
.a2key svg{width:20px;height:20px}.a2key.big{min-width:54px;height:54px;border-radius:14px;font-size:30px;background:var(--sunk);border-color:var(--line);color:#0a84ff}.a2key.big svg{width:30px;height:30px}
.a2row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-width:220px;max-width:100%;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px}
.a2pill{display:inline-block;background:#0a84ff;color:#fff;font-weight:700;border-radius:10px;padding:8px 18px;font-size:16px}
.a2done{background:var(--pitch-soft);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.6}
.ledger .bal{font-family:var(--display);font-size:34px;line-height:1.1;letter-spacing:.5px}.ledger .bal.neg{color:var(--no)}
.lsum{display:grid;grid-template-columns:1fr 1fr;gap:8px}.lsum>div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px}
.lsum span{font-size:12px;color:var(--muted)}.lsum b{font-size:16px;font-variant-numeric:tabular-nums}.lsum em{font-style:normal;font-size:12px;color:var(--muted)}
.ledger .in{color:var(--pitch)}.ledger .out{color:var(--no)}
.llist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;width:100%}
button.lrow{cursor:pointer}.lrow .ld{font-size:13px;color:var(--muted);width:38px;font-variant-numeric:tabular-nums}
.lrow .li{display:flex;flex-direction:column;min-width:0}.lrow .li em{font-style:normal;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow>b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ver{margin:24px auto 8px;max-width:440px;width:100%;text-align:center;font-size:12px;color:var(--muted)}
.ver summary{cursor:pointer;list-style:none;padding:6px;font-weight:500}.ver summary::-webkit-details-marker{display:none}
.ver summary::after{content:" ▾"}.ver[open] summary::after{content:" ▴"}
.verlog{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.verlog ul{margin:4px 0 0;padding-left:18px}.verlog li{margin:2px 0}
.tbadge .tnm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tbadge.K{background:#1b1d1c;color:#fff;border-color:#55605a}.tbadge.U{background:#2563d6;color:#fff}.tbadge.Y{background:#f2c418;color:#231c00}.tbadge.R{background:#d6332a;color:#fff}.tbadge.W{background:#fbfbf8;color:#1b1d1c;border-color:#9aa29b}.tbadge.P{background:#ff4fa3;color:#fff}
.possel{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-size:15px;font-weight:700}
.count{font-weight:700}
.y{color:var(--ok)} .n{color:var(--no)}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.score .team{display:flex;flex-wrap:nowrap;align-items:center;gap:5px;font-weight:700;min-width:0}.score .team .tbadge{flex:0 1 auto;min-width:0;padding:4px 8px}
.sb{display:flex;flex-direction:column;gap:6px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.sbrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;min-width:0}
.sbside{width:30px}.sbrow .team{display:flex;align-items:center;gap:6px;min-width:0}.sbrow .tbadge{min-width:0}
.sbrow .pts{font-family:var(--display);font-size:28px;line-height:1;min-width:1.6em;text-align:right;color:var(--muted)}.sbrow.win .pts{color:var(--fg)}.sb .wdl.d{background:var(--surface)}
.score .team:last-child{justify-content:flex-end}
.wdl{flex:none;font-size:12px;font-weight:800;border-radius:6px;padding:3px 7px;line-height:1.2}.wdl.w{background:var(--pitch-soft);color:var(--ok)}.wdl.l{background:var(--no-soft);color:var(--no)}.wdl.d{background:var(--sunk);color:var(--muted)}
.score .num{font-family:var(--display);font-size:28px;line-height:1;letter-spacing:1px;background:var(--sunk);border-radius:8px;padding:6px 10px;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px}
.tbl .n2{text-align:right}
.trec td{font-size:17px;font-weight:700;border-bottom:0}.trec th,.trec td{padding-left:4px;padding-right:4px}.tbl.trec .n2{text-align:center}
.form{display:inline-flex;gap:4px}.fm{display:inline-grid;place-items:center;width:26px;height:24px;border-radius:6px;font-size:12px;font-weight:800;border:1.5px solid currentColor}
.fm.w{color:var(--ok);background:var(--pitch-soft)}.fm.l{color:var(--no);background:var(--no-soft)}.fm.d{color:var(--muted);background:var(--sunk)}
.fm.now{box-shadow:0 3px 0 -1px var(--bg),0 4px 0 0 currentColor}
.numtag{display:inline-block;min-width:26px;margin-right:6px;font-family:var(--display);color:var(--muted);text-align:right}
.tbl.nowrap th,.tbl.nowrap td{white-space:nowrap;padding-left:7px;padding-right:7px}
.scroll{overflow-x:auto}
.notice{background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.empty{text-align:center;padding:26px 14px;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;min-width:0;flex:1}
label.f input,label.f select,div.f input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 10px;font-size:16px;width:100%;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.paid{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.paid:last-child{border-bottom:0}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.pill.ok{background:var(--pitch-soft);color:var(--ok)} .pill.no{background:var(--no-soft);color:var(--no)}
.member{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.kit{width:34px;height:34px;border-radius:8px;background:var(--pitch-soft);color:var(--pitch);font-family:var(--display);display:grid;place-items:center;font-size:15px;flex:none}
.member .who{flex:1;min-width:0}
.member .who b{display:block}
details summary{cursor:pointer;font-weight:700;font-size:14px;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:" ▾";color:var(--muted)}
details[open]>summary::after{content:" ▴"}
.scrim{position:fixed;inset:0;background:rgba(5,12,7,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet>*{flex-shrink:0}
.sheet .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90%;text-align:center}
.copybox{width:100%;min-height:140px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px;font-size:13px}
.gate{display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:10px}
.gate .card{max-width:440px;width:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:var(--sunk);width:30px;height:30px;font-weight:700}
.stepper span{min-width:28px;text-align:center;font-weight:700}
.msg{font-size:14px;border-radius:8px;padding:8px 10px;background:var(--sunk)}
.msg.err{background:var(--no-soft);color:var(--no)}
.msg.ok{background:var(--pitch-soft);color:var(--ok)}
.loading{opacity:.6;pointer-events:none}
body.syncing header.top{overflow:hidden}body.syncing header.top::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:35%;background:rgba(255,255,255,.9);animation:syncbar 1.1s ease-in-out infinite}
@keyframes syncbar{0%{left:-35%}100%{left:100%}}
/* ── 인트로(앱 처음 켤 때): 남색 경기장 + 엠블럼 → 호랑이 발톱 4줄 → 분홍으로 물들며 입장 ── */
#splash{position:fixed;inset:0;z-index:9999;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff;background:radial-gradient(120% 80% at 50% 38%,#24407a 0%,#13254d 55%,#0a1630 100%);padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
#splash::before{content:"";position:absolute;inset:0;z-index:1;background:radial-gradient(120% 80% at 50% 38%,#ff4fb0 0%,#ff1493 45%,#c80e74 100%);opacity:0;animation:spFade .45s ease 1.35s forwards}
#splash .sp-fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;animation:spJolt .3s ease .95s}
#splash .sp-fx .pitch line,#splash .sp-fx .pitch circle{stroke-dasharray:1;stroke-dashoffset:1;animation:spDraw .7s ease-out forwards}
#splash .sp-fx .pitch circle{animation-delay:.15s}
#splash .sp-fx .cw{animation:spDraw .3s cubic-bezier(.7,0,.3,1) forwards}#cm0 .cw{animation-delay:.9s}#cm1 .cw{animation-delay:.95s}#cm2 .cw{animation-delay:1s}#cm3 .cw{animation-delay:1.05s}
#splash .sp-cr,#splash b,#splash .sp-sub{position:relative;z-index:2}
#splash .sp-cr{height:200px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));animation:spPop .7s cubic-bezier(.2,1.4,.4,1) .2s both,spShake .3s ease .95s}
#splash b{font-family:var(--display);font-weight:400;font-size:40px;letter-spacing:1px;text-shadow:0 2px 0 rgba(0,0,0,.18);margin-top:4px;color:#f3cf6a;animation:spWhite .4s ease 1.35s forwards}
#splash .sp-sub{font-size:13px;letter-spacing:4px;opacity:.85;margin-top:-8px;text-align:center}
#splash .sp-bar{position:absolute;z-index:2;bottom:calc(110px + env(safe-area-inset-bottom,0px));width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);overflow:hidden}
#splash .sp-bar i{display:block;height:100%;width:0;border-radius:4px;background:#f3cf6a;animation:spBar 1.5s ease-out .1s forwards,spWhiteBg .4s ease 1.35s forwards}
#splash .sp-ver{position:absolute;z-index:2;bottom:calc(52px + env(safe-area-inset-bottom,0px));font-size:12px;opacity:.75}
#splash.out{opacity:0;pointer-events:none;transition:opacity .4s ease .12s}
#splash.out .sp-cr{animation:spOut .55s cubic-bezier(.3,0,.3,1) forwards}
#splash.out b,#splash.out .sp-sub,#splash.out .sp-bar,#splash.out .sp-ver{opacity:0;transition:opacity .2s}
@keyframes spPop{from{transform:scale(.6);opacity:0}}
@keyframes spShake{30%{transform:translate(-5px,3px) rotate(-3deg)}60%{transform:translate(4px,-2px) rotate(2deg)}}
@keyframes spJolt{30%{transform:translate(-6px,4px)}60%{transform:translate(4px,-3px)}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFade{to{opacity:1}}
@keyframes spWhite{to{color:#fff}}
@keyframes spBar{to{width:100%}}
@keyframes spWhiteBg{to{background:#fff}}
@keyframes spOut{from{transform:scale(1)}to{transform:scale(1.5)}}
@media (prefers-reduced-motion:reduce){#splash .sp-cr,#splash .sp-fx{animation:none}}
</style>

var DRAG={el:null,sid:null,sx:0,sy:0,moved:false,justDragged:false,rect:null};
document.addEventListener("pointerdown",function(e){var el=e.target.closest(".slot");if(!el||!TD)return;
  var pitch=el.closest(".pitch");DRAG={el:el,sid:el.dataset.s,sx:e.clientX,sy:e.clientY,moved:false,justDragged:false,rect:pitch.getBoundingClientRect(),pid:e.pointerId}});
document.addEventListener("pointermove",function(e){if(!DRAG.el||e.pointerId!==DRAG.pid)return;
  if(!DRAG.moved&&Math.abs(e.clientX-DRAG.sx)+Math.abs(e.clientY-DRAG.sy)<8)return;
  if(!DRAG.moved){DRAG.moved=true;DRAG.el.classList.add("drag");try{DRAG.el.setPointerCapture(e.pointerId)}catch(_){}}
  e.preventDefault();var r=DRAG.rect,x=Math.max(7,Math.min(93,(e.clientX-r.left)/r.width*100)),y=Math.max(6,Math.min(94,(e.clientY-r.top)/r.height*100));

  var lab=DRAG.el.querySelector("small,em");if(lab)lab.textContent=zonePos(x,y)},{passive:false});

  }
});
document.addEventListener("change",function(e){if(e.target.classList&&e.target.classList.contains("possel")&&MD){readMatch();MD.pos[e.target.dataset.id]=e.target.value;drawMatch();return}var id=e.target.id||"";if(MD&&/^m-(A|B)-(color|score)$/.test(id)&&document.getElementById("m-sid")){readMatch();drawMatch()}});
document.addEventListener("toggle",function(e){if(e.target.id==="pastBox")S.showPast=e.target.open;var k=e.target.dataset&&e.target.dataset.k;if(k&&e.target.classList&&(e.target.classList.contains("mon")||e.target.classList.contains("day"))){S.openM=S.openM||{};S.openM[k]=e.target.open}},true);

document.addEventListener("submit",function(e){
  e.preventDefault();var f=e.target;function v(id){var el=f.querySelector("#"+id);return el?el.value.trim():""}
  var btn=f.querySelector("button[type=submit]");if(btn)btn.disabled=true;
  function done(){if(btn)btn.disabled=false}
  if(f.id==="loginForm"){
    call("memberLogin",v("l-name"),v("l-pin")).then(function(r){
      if(r.ok){A.mid=r.mid;A.pin=r.pin;saveAuth();closeSheet();S.gateMsg=null;refresh()}
      else{S.gateMsg=r.pending?{t:"",m:"가입 신청이 접수돼 있어요. 운영진 승인 후 로그인할 수 있어요."}:{t:"err",m:"이름이나 PIN이 맞지 않아요."};if(S.d){toast(S.gateMsg.m)}else renderGate()}
    }).catch(fail).then(done);
  }else if(f.id==="adminForm"){
    call("adminLogin",v("a-pw")).then(function(ok){if(ok){A.pw=v("a-pw");saveAuth();S.gateMsg=null;refresh()}else{S.gateMsg={t:"err",m:"비밀번호가 맞지 않아요."};renderGate()}}).catch(fail).then(done);
  }else if(f.id==="joinForm"){
    if(!pickedOrder("j-pos").length){S.gateMsg={t:"err",m:"선호 포메이션을 하나 이상 골라 주세요."};keepJoin();done();return}
    if(!/^\d{4,6}$/.test(v("j-pin"))){S.gateMsg={t:"err",m:"PIN은 숫자 4~6자리로 정해 주세요."};keepJoin();done();return}
    if(v("j-pin")!==v("j-pin2")){S.gateMsg={t:"err",m:"PIN 확인이 일치하지 않아요."};keepJoin();done();return}
    call("apply",{name:v("j-name"),pos:pickedOrder("j-pos").join(","),num:v("j-num"),pin:v("j-pin"),phone:v("j-phone"),note:v("j-note")}).then(function(){
      S.gateMode="login";S.gateMsg={t:"ok",m:"가입 신청이 접수됐어요! 운영진이 승인하면 이름과 PIN으로 로그인하세요."};renderGate();
    }).catch(function(err){S.gateMsg={t:"err",m:esc(errText(err))};keepJoin();done()});
  }else if(f.id==="sessForm"){
    closeSheet();act(call("saveSession",A,{id:f.dataset.id,date:v("s-date"),time:v("s-time"),place:v("s-place"),note:v("s-note")}),"일정을 저장했어요");
  }else if(f.id==="memForm"){
    if(v("mm-pin")&&!/^\d{4,6}$/.test(v("mm-pin"))){toast("PIN은 숫자 4~6자리예요");done();return}
    var pickP=pickedOrder("mm-pos");if(!pickP.length){toast("선호 포메이션을 하나 이상 골라 주세요");done();return}
    closeSheet();act(call("saveMember",A,{id:f.dataset.id,name:v("mm-name"),pos:pickP.join(","),num:v("mm-num"),pin:v("mm-pin"),phone:v("mm-phone"),staff:!!(f.querySelector("#mm-staff")&&f.querySelector("#mm-staff").checked)}),"회원 정보를 저장했어요");
  }else if(f.id==="duesForm"){
    closeSheet();act(call("saveClub",A,{dues:v("d-amt")}),"회비 금액을 저장했어요");
  }else if(f.id==="clubForm"){
    closeSheet();act(call("saveClub",A,{name:v("c-name"),place:v("c-place")}),"저장했어요");
  }
});
document.addEventListener("input",function(e){var t=e.target;if(t.classList&&t.classList.contains("cinput")){S.cmDraft=S.cmDraft||{};S.cmDraft[t.dataset.id]=t.value}});
document.addEventListener("keydown",function(e){var t=e.target;if(e.key==="Enter"&&!e.isComposing&&t.classList&&t.classList.contains("cinput")){e.preventDefault();cmSend(t.dataset.id)}});
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&S.d)refresh()});

call("getPublic").then(function(p){S.club=p.club;$("#clubName").textContent=S.club;document.title=S.club;if(!S.d)render()}).catch(function(){});
if(A.pw||A.mid){var cd=cachedData();if(cd){applyData(cd);render()}refresh()}else render();
if(!IS_GAS&&"serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
